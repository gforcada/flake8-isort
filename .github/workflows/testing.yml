name: Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Testing on
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3.15", "3.14", "3.13", "3.12", "3.11", "pypy-3.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv + caching
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            tox.ini
            pyproject.toml
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: uvx --with flake8 --with isort pytest run_tests.py

  lint:
    name: Lint code
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv + caching
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            tox.ini
            pyproject.toml
          python-version: ${{ matrix.python-version }}
      - name: Run linting
        run: uvx prek run -a
